- name: Build Debug APK
        run: |
          if [ -d ".github/app" ] && [ ! -d "app" ]; then
            cp -r .github/app ./app
          fi
          if [ -f ".github/build.gradle.kts" ] && [ ! -f "build.gradle.kts" ]; then
            cp .github/build.gradle.kts ./build.gradle.kts
          fi
          if [ -f ".github/settings.gradle.kts" ] && [ ! -f "settings.gradle.kts" ]; then
            cp .github/settings.gradle.kts ./settings.gradle.kts
          fi
          ls -la
          gradle assembleDebug --stacktrace --no-daemon
